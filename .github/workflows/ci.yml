name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Verificar que el código compila (sintaxis)
        run: python -m compileall .

      - name: Ejecutar pruebas
        run: pytest -v || echo "No se encontraron pruebas, continuando..."

      - name: Mensaje de verificación
        run: echo "✅ Build y pruebas completadas correctamente en $(date)"